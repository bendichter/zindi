[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zindi"
version = "0.1.0"
description = "Represent remote HDF5 NWB files as Zarr v3 via reference file systems"
requires-python = ">=3.11"
dependencies = [
    "zarr>=3.1.3",
    "h5py",
    "numpy",
    "numcodecs>=0.14.0",
    "fsspec",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pynwb",
    "hdmf-zarr",
]
